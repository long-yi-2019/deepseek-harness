name: Build Desktop (Windows x64)
on:
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest   # Windows 包必须在 Windows runner 上打
    env:
      # README 要求的三个必填环境变量，自用随便填
      DSH_DESKTOP_APP_ID: com.example.dshdesktop
      DSH_DESKTOP_AUTO_UPDATE_ENV: test
      DOWNLOAD_TEST_ORIGIN: https://desktop-updates.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4        # 自动读 package.json 里的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package:desktop:win:x64:unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-win-x64
          path: apps/desktop/.desktop-build/targets/win-x64/artifacts/*
